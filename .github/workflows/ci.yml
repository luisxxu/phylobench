name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-file: envs/phylobench.yaml
          micromamba-version: '2.9.0-0'
          init-shell: bash
          cache-environment: true
      - run: pip install -e . --no-deps
      # Snakemake --use-conda needs conda >= 24.7.1, which ubuntu-latest no longer ships.
      # A pinned conda lives in its own prefix; only its `conda` is put on PATH so the
      # phylobench env's python and snakemake stay first.
      - name: pinned conda for snakemake
        run: |
          micromamba create -y -p "$HOME/conda-tool" -c conda-forge --override-channels conda=26.7.3
          mkdir -p "$HOME/conda-shim" && ln -s "$HOME/conda-tool/bin/conda" "$HOME/conda-shim/conda"
          echo "CONDA_BIN=$HOME/conda-shim" >> "$GITHUB_ENV"
      - run: ruff check .
      - run: ruff format --check .
      - run: snakemake --lint
      - run: snakemake -n --configfile config/smoke.yaml
      - run: PATH="$PATH:$CONDA_BIN" pytest
      - run: snakemake plots -c 1

  arms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      arms: ${{ steps.glob.outputs.arms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: glob
        run: |
          arms=$(python3 -c 'import json, pathlib; print(json.dumps(sorted(p.stem for p in pathlib.Path("config/arms").glob("*.yaml") if not p.stem.endswith("-gpu"))))')
          echo "arms=$arms" >> "$GITHUB_OUTPUT"

  smoke-arm:
    needs: arms
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(needs.arms.outputs.arms) }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-file: envs/phylobench.yaml
          micromamba-version: '2.9.0-0'
          init-shell: bash
          cache-environment: true
      - run: pip install -e . --no-deps
      # Snakemake --use-conda needs conda >= 24.7.1, which ubuntu-latest no longer ships.
      # A pinned conda lives in its own prefix; only its `conda` is put on PATH so the
      # phylobench env's python and snakemake stay first.
      - name: pinned conda for snakemake
        run: |
          micromamba create -y -p "$HOME/conda-tool" -c conda-forge --override-channels conda=26.7.3
          mkdir -p "$HOME/conda-shim" && ln -s "$HOME/conda-tool/bin/conda" "$HOME/conda-shim/conda"
          echo "CONDA_BIN=$HOME/conda-shim" >> "$GITHUB_ENV"
      - name: smoke
        run: |
          set -o pipefail
          PATH="$PATH:$CONDA_BIN" snakemake --use-conda --configfile config/smoke.yaml -c 2 \
            --config arm=${{ matrix.arm }} 2>&1 | tee smoke.log
      - name: locked env pins installed (no YAML fallback)
        run: "! grep -q 'Failed to install conda environment from pin file' smoke.log"
      - name: acceptance checks
        run: python workflow/scripts/check_smoke.py --configfile config/smoke.yaml --arm ${{ matrix.arm }}
      - name: tail logs
        if: failure()
        run: |
          find results -name '*.log' -print -exec tail -n 40 {} \; || true
          tail -n 60 smoke.log || true

  smoke:
    needs: smoke-arm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every smoke-arm job passed
        run: test "${{ needs.smoke-arm.result }}" = success
