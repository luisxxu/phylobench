# EMP stage (T19, run after the gg2 stage): scaling and concordance with sepp-prod.
# EMP has no truth and no oracle alignment, so regions/alns are fixed per dataset.
datasets: [emp-10k, emp-100k]
backbones: [B10k, Bfull]
regions: [V4-150]
alns: [hmmalign]
# bscampp-b5000 is a T29 lever, not a screened arm.
exclude:
  - {arm: [bscampp-b5000]}
