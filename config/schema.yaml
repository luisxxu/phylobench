$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
properties:
  datasets:
    type: array
    items:
      type: string
    uniqueItems: true
  backbones:
    type: array
    items:
      type: string
      minLength: 1
    uniqueItems: true
  regions:
    type: array
    items:
      enum: [full-length, V4-150, V3-V4, V1-V2]
    uniqueItems: true
  arms:
    type: object
    additionalProperties:
      type: object
  threads:
    type: integer
    minimum: 1
    # default is filled into config in place by snakemake validate(); 16 = fixed per-job thread invariant
    default: 16
