# T28 on gg2-wol at B10k* only (docs/runbook-t28.md); T22's gg2 set is not run.
# Regions are the frozen S0 list: full-length, V4-150, and each primer region with
# >= 1,000 queries, else its `c` twin (V7-V9c). 5 arms x 9 regions = 45 cells.
datasets: [gg2-wol]
backbones: [B10k]
regions: [full-length, V4-150, V3-V4, V1-V2, V1-V3, V4-V5, V5-V6, V6-V8, V7-V9c]
alns: [hmmalign]
exclude:
  - {arm: [pplacer, epa-ng, apples2, dipper-r, dipper-m, dipper-m-gpu]}
