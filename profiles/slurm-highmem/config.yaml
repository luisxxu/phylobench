# Overlay of profiles/slurm for T30 (docs/runbook-t30.md): every Bfull* cost job runs on
# the Xeon Gold 6242 highmem nodes, one task each. A workflow profile replaces
# set-resources wholesale, so this is a full copy; only the highmem and tasks lines differ.
# Retries stay 0: a DNF is data (CLAUDE.md). No `group` keys: one rule per sbatch keeps
# the srun step cgroup's memory.peak clean (docs/harness.md section 4).
# --no-requeue lives in slurm_extra, not slurm-no-requeue, so `--executor local` works
# without the SLURM plugin installed.
executor: slurm
jobs: 20
retries: 0
use-conda: true
default-resources:
  slurm_account: knightlab
  slurm_partition: short
  runtime: 1440
  mem_mb: 32000
  slurm_extra: "'--no-requeue'"
set-resources:
  # Without tasks: 1 an --exclusive 64-CPU node can start 64/16 = 4 copies of one tool
  # (T29 S0b incident); the post-run sacct NTasks check is the guard (the plugin and
  # jobstep versions are pinned in envs/phylobench.yaml).
  hmmbuild: &prep_resources
    slurm_partition: long
    runtime: 4320
    mem_mb: 196608
    slurm_extra: "'--no-requeue'"
  upp_align: *prep_resources
  refprep_me_tree: *prep_resources
  hmmalign: &highmem_shared
    slurm_partition: highmem
    runtime: 4320
    mem_mb: 196608
    tasks: 1
    slurm_extra: "'--no-requeue'"
  guppy_tog: *highmem_shared
  sepp_prod: &highmem_place
    slurm_partition: highmem
    runtime: 4320
    mem_mb: 1500000
    tasks: 1
    slurm_extra: "'--exclusive --no-requeue'"
  sepp_pinned_place: *highmem_place
  pplacer_place: *highmem_place
  pplacer_scampp_place: *highmem_place
  epa_ng_scampp_place: *highmem_place
  bscampp_place: *highmem_place
  bscampp_b5000_place: *highmem_place
  epa_ng_place: *highmem_place
  apples2_place: *highmem_place
  dipper_m_place: *highmem_place
  dipper_r_place: *highmem_place
  # gpu partition caps MaxMemPerCPU at 12288 MB; above 16 x 12288 SLURM raises the CPU
  # count past b-gpu-21's 32 and rejects the job ("CPU count per node can not be satisfied").
  dipper_m_gpu_place:
    slurm_partition: gpu
    gpu: 1
    runtime: 4320
    mem_mb: 196608
    slurm_extra: "'--exclusive --no-requeue --nodelist=b-gpu-21'"
  # Post-processing holds full jplace/tree tables; 100k-query Bfull runs outgrow the 32 GB
  # default.
  similarity: &post_resources
    mem_mb: 128000
  evaluate: *post_resources
  concordance: *post_resources
  dipper_to_jplace: *post_resources
