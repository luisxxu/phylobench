[project]
name = "phylobench"
version = "0.0.0"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "pandas", "matplotlib", "treeswift", "psutil", "pyyaml"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
